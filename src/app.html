<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ff6f3c" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;700&family=Roboto+Mono:wght@700&display=swap"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;700&family=Roboto+Mono:wght@700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&icon_names=add,backspace,bar_chart,calculate,check,check_circle,close,content_copy,done,error,exercise,fitness_center,published_with_changes,remove,sports_score,warning&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				var preferredBarWeight = window.localStorage.getItem('how-heavy:preferred-bar-weight');
				if (preferredBarWeight === '15' || preferredBarWeight === '20') {
					document.documentElement.dataset.barTheme = preferredBarWeight;
				}
			} catch {
				// Ignore storage access failures and fall back to the default theme.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
